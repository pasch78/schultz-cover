<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>schultz.us</title>
    
    <!-- External Font: Inter to align with Blackwald's typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Premium Dark Theme Variables */
        :root {
            --bg-charcoal: #121315;
            --text-primary: #EAEAEA;
            --text-secondary: #88929B;
            --text-muted: #4A5158;
            --accent-line: #2A2F35;
        }

        body { 
            background-color: var(--bg-charcoal); 
            color: var(--text-primary); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Entrance Animation echoing Blackwald */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .container { 
            max-width: 400px; 
            padding: 20px; 
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Graphic Sizing */
        .family-graphic {
            width: 80px;
            height: auto;
            margin: 0 auto 2rem auto;
            display: block;
        }

        /* Wide-spaced Subheader */
        h2 { 
            font-weight: 400;
            font-size: 0.75rem; 
            letter-spacing: 0.3em; 
            margin-right: -0.3em; /* Compensates for trailing letter-spacing to perfectly center */
            line-height: 1.6; 
            margin-bottom: 2rem; 
            text-transform: uppercase; 
            color: var(--text-secondary);
        }

        /* Vertical Divider instead of a horizontal line */
        .divider { 
            width: 1px; 
            height: 30px; 
            background-color: var(--accent-line); 
            margin: 0 auto 2rem auto; 
        }

        /* Clean Narrative Text */
        p { 
            font-weight: 300;
            font-size: 0.9rem; 
            color: var(--text-secondary); 
            margin: 0 0 2rem 0; 
            letter-spacing: 0.05em;
        }

        /* Executive Footer Styling */
        .footer { 
            font-weight: 400;
            font-size: 0.65rem; 
            color: var(--text-muted); 
            letter-spacing: 0.4em; 
            margin-right: -0.4em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Family Anchor / Compass Graphic -->
        <svg class="family-graphic" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Central Meridian (Vertical Axis) -->
            <line x1="50" y1="15" x2="50" y2="75" stroke="#EAEAEA" stroke-width="1.25" stroke-linecap="round" />
            
            <!-- Baseline (Horizon Axis) -->
            <line x1="25" y1="75" x2="75" y2="75" stroke="#4A5158" stroke-width="1" stroke-linecap="round" />
            
            <!-- Compass Dial / Subsurface Arc -->
            <path d="M 30 55 A 24 24 0 0 0 70 55" fill="none" stroke="#88929B" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
            
            <!-- Primary Pointer (North Indicator) -->
            <polygon points="50,10 54,25 46,25" fill="#EAEAEA" />
            
            <!-- Structural Support Coordinates -->
            <line x1="35" y1="45" x2="50" y2="60" stroke="#88929B" stroke-width="0.75" stroke-linecap="round" opacity="0.5" />
            <line x1="65" y1="45" x2="50" y2="60" stroke="#88929B" stroke-width="0.75" stroke-linecap="round" opacity="0.5" />
        </svg>
        
        <!-- Domains -->
        <h2>schultz.us / schultz.nyc</h2>
        
        <!-- Vertical Divider -->
        <div class="divider"></div>
        
        <!-- Tagline -->
        <p>A private digital space.</p>
        
        <!-- Footer -->
        <div class="footer">EST. 2006</div>
    </div>
</body>
</html>
