<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>schultz.us</title>
    
    <!-- External Font: Inter to align with the premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Premium Dark Theme Variables */
        :root {
            --bg-charcoal: #121315;
            --text-primary: #EAEAEA;
            --text-secondary: #88929B;
            --text-muted: #4A5158;
            --accent-line: #2A2F35;
        }

        body { 
            background-color: var(--bg-charcoal); 
            color: var(--text-primary); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Entrance Animation */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .container { 
            max-width: 400px; 
            padding: 20px; 
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Graphic Sizing */
        .family-graphic {
            width: 75px;
            height: auto;
            margin: 0 auto 2.5rem auto;
            display: block;
        }

        /* Wide-spaced Subheader */
        h2 { 
            font-weight: 400;
            font-size: 0.75rem; 
            letter-spacing: 0.3em; 
            margin-right: -0.3em; 
            line-height: 1.6; 
            margin-bottom: 2rem; 
            text-transform: uppercase; 
            color: var(--text-secondary);
        }

        /* Vertical Divider */
        .divider { 
            width: 1px; 
            height: 30px; 
            background-color: var(--accent-line); 
            margin: 0 auto 2rem auto; 
        }

        /* Clean Narrative Text */
        p { 
            font-weight: 300;
            font-size: 0.9rem; 
            color: var(--text-secondary); 
            margin: 0 0 2rem 0; 
            letter-spacing: 0.05em;
        }

        /* Executive Footer Styling */
        .footer { 
            font-weight: 400;
            font-size: 0.65rem; 
            color: var(--text-muted); 
            letter-spacing: 0.4em; 
            margin-right: -0.4em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Minimalist Family Crest Line Art -->
        <svg class="family-graphic" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <!-- This clip path ensures all background facets stay perfectly inside the shield -->
                <clipPath id="shield-clip">
                    <path d="M 20 20 L 80 20 L 80 65 C 80 95 50 115 50 115 C 50 115 20 95 20 65 Z" />
                </clipPath>
            </defs>

            <!-- Background Elements (Clipped) -->
            <g clip-path="url(#shield-clip)">
                <!-- Fine Facet Lines (Nodding to the low-poly 3D texture) -->
                <path d="M 50 20 L 20 65 M 50 20 L 80 65 M 20 65 L 50 85 L 80 65 M 50 85 L 50 115" fill="none" stroke="#88929B" stroke-width="0.5" opacity="0.2" />
                <path d="M 20 40 L 50 55 L 80 40 M 35 20 L 50 55 M 65 20 L 50 55" fill="none" stroke="#88929B" stroke-width="0.5" opacity="0.2" />

                <!-- The Diagonal Bend -->
                <line x1="20" y1="20" x2="90" y2="90" stroke="#88929B" stroke-width="1.25" opacity="0.6" />
                <line x1="-10" y1="30" x2="80" y2="120" stroke="#88929B" stroke-width="1.25" opacity="0.6" />
            </g>

            <!-- Main Shield Outline -->
            <path d="M 20 20 L 80 20 L 80 65 C 80 95 50 115 50 115 C 50 115 20 95 20 65 Z" fill="none" stroke="#EAEAEA" stroke-width="1.5" stroke-linejoin="round" />

            <!-- 3 Geometric Flowers (Minimalist Pentagons) -->
            <!-- Top Left -->
            <polygon points="35,50 39.8,53.5 37.9,59 32.1,59 30.2,53.5" fill="none" stroke="#EAEAEA" stroke-width="1" stroke-linejoin="round"/>
            <circle cx="35" cy="55" r="1.5" fill="#EAEAEA" />

            <!-- Center -->
            <polygon points="50,65 54.8,68.5 52.9,74 47.1,74 45.2,68.5" fill="none" stroke="#EAEAEA" stroke-width="1" stroke-linejoin="round"/>
            <circle cx="50" cy="70" r="1.5" fill="#EAEAEA" />

            <!-- Bottom Right -->
            <polygon points="65,80 69.8,83.5 67.9,89 62.1,89 60.2,83.5" fill="none" stroke="#EAEAEA" stroke-width="1" stroke-linejoin="round"/>
            <circle cx="65" cy="85" r="1.5" fill="#EAEAEA" />
        </svg>
        
        <!-- Domains -->
        <h2>schultz.us / schultz.nyc</h2>
        
        <!-- Vertical Divider -->
        <div class="divider"></div>
        
        <!-- Tagline -->
        <p>A private digital space.</p>
        
        <!-- Footer -->
        <div class="footer">EST. 2006</div>
    </div>
</body>
</html>
