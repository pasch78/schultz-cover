<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>schultz.us</title>
    
    <!-- External Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Premium Dark Theme Variables */
        :root {
            --bg-charcoal: #121315;
            --text-primary: #EAEAEA;
            --text-secondary: #88929B;
            --text-muted: #4A5158;
            --accent-line: #2A2F35;
        }

        body { 
            background-color: var(--bg-charcoal); 
            color: var(--text-primary); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Entrance Animation */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .container { 
            max-width: 400px; 
            padding: 20px; 
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Reused Forest Graphic Sizing & Color Override */
        .logo-graphic {
            width: 120px;
            height: auto;
            margin: 0 auto 2.5rem auto;
            display: block;
        }

        /* Wide-spaced Subheader */
        h2 { 
            font-weight: 400;
            font-size: 1rem; 
            letter-spacing: 0.3em; 
            margin-right: -0.3em; 
            line-height: 1.6; 
            margin-bottom: 2rem; 
            /* text-transform: uppercase; */
            color: var(--text-secondary);
        }

        /* Vertical Divider */
        .divider { 
            width: 1px; 
            height: 30px; 
            background-color: var(--accent-line); 
            margin: 0 auto 2rem auto; 
        }

        /* Clean Narrative Text */
        p { 
            font-weight: 300;
            font-size: 0.9rem; 
            color: var(--text-secondary); 
            margin: 0 0 2rem 0; 
            letter-spacing: 0.05em;
        }

        /* Executive Footer Styling */
        .footer { 
            font-weight: 400;
            font-size: 0.65rem; 
            color: var(--text-muted); 
            letter-spacing: 0.4em; 
            margin-right: -0.4em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Reused Blackwald Conifer Canopy Graphic (Palette Aligned) -->
        <svg class="logo-graphic" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g transform="translate(0, 0)">
                
                <!-- Subsurface Roots -->
                <path d="M 60 130 Q 55 140 48 145" fill="none" stroke="var(--text-primary)" stroke-width="0.75" stroke-linecap="round" opacity="0.2" />
                <path d="M 60 130 Q 65 138 70 142" fill="none" stroke="var(--text-primary)" stroke-width="0.75" stroke-linecap="round" opacity="0.2" />
                
                <path d="M 95 130 Q 88 142 80 150" fill="none" stroke="var(--text-primary)" stroke-width="0.75" stroke-linecap="round" opacity="0.2" />
                <path d="M 95 130 Q 102 145 110 155" fill="none" stroke="var(--text-primary)" stroke-width="0.75" stroke-linecap="round" opacity="0.2" />
                
                <path d="M 130 130 Q 120 145 112 155" fill="none" stroke="var(--text-primary)" stroke-width="0.75" stroke-linecap="round" opacity="0.2" />
                <path d="M 130 130 Q 140 142 148 150" fill="none" stroke="var(--text-primary)" stroke-width="0.75" stroke-linecap="round" opacity="0.2" />

                <!-- Horizon Anchor -->
                <line x1="25" y1="130" x2="175" y2="130" stroke="var(--text-secondary)" stroke-width="1.25" stroke-linecap="round" opacity="0.4" />

                <!-- Central Trunks -->
                <line x1="60" y1="80" x2="60" y2="130" stroke="var(--text-primary)" stroke-width="1" stroke-linecap="round" />
                <line x1="95" y1="45" x2="95" y2="130" stroke="var(--text-primary)" stroke-width="1.25" stroke-linecap="round" />
                <line x1="130" y1="20" x2="130" y2="130" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" />

                <!-- 1. Small Tree -->
                <path d="M 60 90 Q 50 100 45 110" fill="none" stroke="var(--text-primary)" stroke-width="1" stroke-linecap="round" />
                <path d="M 60 90 Q 70 100 75 110" fill="none" stroke="var(--text-primary)" stroke-width="1" stroke-linecap="round" />
                <path d="M 60 105 Q 48 115 40 125" fill="none" stroke="var(--text-primary)" stroke-width="1" stroke-linecap="round" />
                <path d="M 60 105 Q 72 115 80 125" fill="none" stroke="var(--text-primary)" stroke-width="1" stroke-linecap="round" />

                <!-- 2. Medium Tree -->
                <path d="M 95 55 Q 83 70 77 85" fill="none" stroke="var(--text-primary)" stroke-width="1.25" stroke-linecap="round" />
                <path d="M 95 55 Q 107 70 113 85" fill="none" stroke="var(--text-primary)" stroke-width="1.25" stroke-linecap="round" />
                <path d="M 95 75 Q 78 95 70 110" fill="none" stroke="var(--text-primary)" stroke-width="1.25" stroke-linecap="round" />
                <path d="M 95 75 Q 112 95 120 110" fill="none" stroke="var(--text-primary)" stroke-width="1.25" stroke-linecap="round" />
                <path d="M 95 95 Q 75 115 65 125" fill="none" stroke="var(--text-primary)" stroke-width="1.25" stroke-linecap="round" />
                <path d="M 95 95 Q 115 115 125 125" fill="none" stroke="var(--text-primary)" stroke-width="1.25" stroke-linecap="round" />

                <!-- 3. Tall Tree -->
                <path d="M 130 30 Q 115 45 108 60" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 130 30 Q 145 45 152 60" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 130 50 Q 110 70 100 90" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 130 50 Q 150 70 160 90" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 130 75 Q 105 100 92 125" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 130 75 Q 155 100 168 125" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-linecap="round" />
            </g>
        </svg>
        
        <!-- Domains -->
        <h2>SCHULTZ.nyc<br  />
        SCHULTZ.us</h2>
        
        <!-- Vertical Divider -->
        <div class="divider"></div>
        
        <!-- Tagline -->
        <p>A private digital space.</p>
        
        <!-- Footer -->
        <div class="footer">EST. 2006</div>
    </div>
</body>
</html>
